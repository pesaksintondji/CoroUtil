name: Build Fabric 1.21.11

on:
  push:
    branches: [ '**' ]
    paths-ignore: [ '**.md' ]
  workflow_dispatch:

jobs:
  build-fabric:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CoroUtil
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The wrapper's download (services.gradle.org -> GitHub releases) can return 504;
      # fetch the distribution with retries + mirrors, verified against the official SHA-256.
      - name: Download Gradle distribution
        run: bash .github/scripts/fetch-gradle.sh gradle/wrapper/gradle-wrapper.properties

      - name: Build CoroUtil (Fabric)
        run: ./gradlew -b build_fabric.gradle build

      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: coroutil-fabric-1.21.11
          path: build/libs/coroutil-fabric-*.jar
          if-no-files-found: error
